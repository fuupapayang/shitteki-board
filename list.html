<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>指摘内容の一覧</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@700;900&display=swap">
<style>
:root{
  --bg:#f3f4f1; --surface:#ffffff; --fg:#1d2522; --muted:#66716c; --line:#d9ddd8;
  --accent:#1f5f4a; --accent-fg:#ffffff; --pin:#e5522b; --pin-fg:#ffffff;
  --ok:#2f7d4f; --warn:#b7791f; --crit:#c0392b; --chip:#e8ece8; --row:#f8f9f7;
  --f-display:"Zen Kaku Gothic New","Noto Sans JP",sans-serif;
  --f-body:"Noto Sans JP",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#161b19; --surface:#1f2623; --fg:#e7ece9; --muted:#9aa6a0; --line:#34403b;
  --accent:#5fc4a0; --accent-fg:#0f1f19; --pin:#ff7a52; --pin-fg:#1a0d08;
  --ok:#62c48a; --warn:#e0b252; --crit:#ff8a7a; --chip:#2a3330; --row:#232b28; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.7 var(--f-body);
  padding:20px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:1500px;margin:0 auto;display:grid;gap:16px}
header{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:end;justify-content:space-between}
h1{font:900 26px/1.3 var(--f-display);margin:0;letter-spacing:.02em}
.sub{color:var(--muted);margin:2px 0 0;font-size:13px}
.hd-actions{display:flex;flex-wrap:wrap;gap:8px}
button,.btn{font:500 13px var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--fg);
  padding:7px 14px;border-radius:6px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
button:hover,.btn:hover{border-color:var(--accent)}
button:focus-visible,.btn:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:700}
select{font:400 13px var(--f-body);color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px}
.bar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.group{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.glabel{font-size:12px;color:var(--muted);font-weight:500;margin-right:2px}
.sortbtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:700}
.count{color:var(--muted);font-size:12px;margin-left:auto}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table.tbl{border-collapse:collapse;width:100%;min-width:820px;font-size:14px;table-layout:fixed}
.tbl th{text-align:left;font-weight:700;font-size:12px;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface);white-space:nowrap}
.tbl td{padding:12px;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}
.tbl tbody tr:nth-child(even) td{background:var(--row)}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.done td{opacity:.6}
.c-no{width:76px}.c-place{width:19%}.c-text{width:auto}.c-kind{width:120px}.c-state{width:150px}
.no{font:900 14px var(--f-display);color:var(--accent)}
.place{font-weight:700}
.text{white-space:pre-wrap}
.chip{display:inline-block;background:var(--chip);border-radius:4px;padding:1px 8px;font-size:12px}
.sev-高{color:var(--crit);font-weight:700}.sev-中{color:var(--warn);font-weight:700}.sev-低{color:var(--muted)}
.stack{display:grid;gap:6px;justify-items:start}
.small{font-size:12px;color:var(--muted)}
.status{width:auto;font-size:12px;padding:3px 8px}
.status[data-s="未対応"]{color:var(--crit)}.status[data-s="対応中"]{color:var(--warn)}.status[data-s="完了"]{color:var(--ok)}
.mini{padding:2px 9px;font-size:12px}
.empty{border:1px dashed var(--line);border-radius:8px;padding:28px 16px;text-align:center;color:var(--muted);background:var(--surface)}
.shot{position:relative;border:1px solid var(--line);border-radius:6px;overflow:hidden;line-height:0;background:var(--bg)}
.shot img{width:100%;height:auto;display:block}
.pin{position:absolute;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;background:var(--pin);color:var(--pin-fg);
  font:700 12px/24px var(--f-body);text-align:center;box-shadow:0 0 0 2px var(--surface),0 2px 6px rgba(0,0,0,.35);pointer-events:none}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.8);display:grid;place-items:center;padding:20px;z-index:20;overflow:auto}
.lb .shot{max-width:min(1100px,100%)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:6px;font-size:13px;z-index:30}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>指摘内容の一覧</h1>
      <p class="sub">共有された指摘を、並べ替えや絞り込みをしながら見渡せます。</p>
    </div>
    <div class="hd-actions">
      <a class="btn primary" href="./">← 指摘を追加する</a>
      <button id="export" type="button">CSVで書き出す</button>
    </div>
  </header>

  <div class="bar">
    <div class="group" role="group" aria-label="並べ替え">
      <span class="glabel">並べ替え</span>
      <button class="sortbtn" type="button" data-key="no">番号順</button>
      <button class="sortbtn" type="button" data-key="date">投稿日時順</button>
      <button class="sortbtn" type="button" data-key="place">指摘箇所順</button>
      <button class="sortbtn" type="button" data-key="sev">重要度順</button>
      <button class="sortbtn" type="button" data-key="status">状況順</button>
      <button class="sortbtn" type="button" data-key="cat">種類順</button>
    </div>
    <div class="group">
      <span class="glabel">絞り込み</span>
      <select id="f-status" aria-label="状況で絞り込み"><option value="">すべての状況</option><option>未対応</option><option>対応中</option><option>完了</option></select>
      <select id="f-cat" aria-label="種類で絞り込み"><option value="">すべての種類</option><option>文言</option><option>デザイン</option><option>挙動</option><option>回答内容</option><option>その他</option></select>
      <select id="f-sev" aria-label="重要度で絞り込み"><option value="">すべての重要度</option><option>高</option><option>中</option><option>低</option></select>
    </div>
    <span class="count" id="count"></span>
  </div>

  <div id="out"><div class="empty">読み込み中…</div></div>
</div>
<div class="lb" id="lb" hidden><div class="shot" id="lbshot"><img id="lbimg" alt="指摘のスクリーンショット"></div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script>
(function(){
  var STATUSES=["未対応","対応中","完了"];
  var SEV_RANK={"高":0,"中":1,"低":2},STATUS_RANK={"未対応":0,"対応中":1,"完了":2};
  var db=null,uid=null,items=[];
  var sort={key:"no",dir:"asc"};
  var $=function(id){return document.getElementById(id)};
  function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
  function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  function toast(m){var t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove()},2600)}
  function fmt(ts){if(!ts)return"";var d=new Date(ts);return (d.getMonth()+1)+"/"+d.getDate()+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")}
  function msg(t){var e=document.createElement("div");e.className="empty";e.textContent=t;$("out").textContent="";$("out").appendChild(e)}

  /* ---------- 並べ替え ---------- */
  try{var sv=JSON.parse(lsGet("shitteki-sort")||"null");if(sv&&sv.key)sort=sv}catch(e){}
  var LABELS={no:"番号順",date:"投稿日時順",place:"指摘箇所順",sev:"重要度順",status:"状況順",cat:"種類順"};
  function syncSort(){
    document.querySelectorAll(".sortbtn").forEach(function(b){
      var on=b.dataset.key===sort.key;b.setAttribute("aria-pressed",on);
      b.textContent=LABELS[b.dataset.key]+(on?(sort.dir==="asc"?" ↑":" ↓"):"");
    });
  }
  document.querySelectorAll(".sortbtn").forEach(function(b){
    b.addEventListener("click",function(){
      if(sort.key===b.dataset.key)sort.dir=sort.dir==="asc"?"desc":"asc";
      else{sort.key=b.dataset.key;sort.dir=(b.dataset.key==="date")?"desc":"asc"}
      lsSet("shitteki-sort",JSON.stringify(sort));syncSort();render();
    });
  });
  function cmpVal(it){
    switch(sort.key){
      case"date":return it.createdAt||0;
      case"place":return it.place||"￿";
      case"sev":return SEV_RANK[it.severity]!=null?SEV_RANK[it.severity]:9;
      case"status":return STATUS_RANK[it.status]!=null?STATUS_RANK[it.status]:9;
      case"cat":return it.category||"";
      default:return it._no;
    }
  }
  ["f-status","f-cat","f-sev"].forEach(function(id){$(id).addEventListener("change",render)});

  /* ---------- 表示 ---------- */
  function pinFor(it){return it.x==null?"":'<span class="pin" style="left:'+(it.x*100)+'%;top:'+(it.y*100)+'%">'+it._no+'</span>'}
  function openLb(it){
    var s=$("lbshot");var old=s.querySelector(".pin");if(old)old.remove();
    $("lbimg").src=it.img;s.insertAdjacentHTML("beforeend",pinFor(it));$("lb").hidden=false;
  }
  $("lb").addEventListener("click",function(){$("lb").hidden=true});
  document.addEventListener("keydown",function(e){if(e.key==="Escape")$("lb").hidden=true});

  function render(){
    var all=items.slice().sort(function(a,b){return a.createdAt-b.createdAt});
    all.forEach(function(it,i){it._no=i+1});
    var fs=$("f-status").value,fc=$("f-cat").value,fv=$("f-sev").value;
    var rows=all.filter(function(it){return(!fs||it.status===fs)&&(!fc||it.category===fc)&&(!fv||it.severity===fv)});
    var m=sort.dir==="asc"?1:-1;
    rows.sort(function(a,b){
      var x=cmpVal(a),y=cmpVal(b);
      var r=(typeof x==="string")?x.localeCompare(y,"ja"):(x-y);
      return r===0?(a._no-b._no):r*m;
    });
    $("count").textContent=rows.length+" / "+all.length+" 件";
    if(!all.length){msg("まだ指摘はありません。「指摘を追加する」から最初の1件を追加してください。");return}
    if(!rows.length){msg("条件に合う指摘はありません。");return}
    var wrap=document.createElement("div");wrap.className="tbl-wrap";
    var t=document.createElement("table");t.className="tbl";
    var cols=[["c-no","No"],["c-place","指摘箇所"],["c-text","指摘内容"],["c-kind","種類・重要度"],["c-state","状況・投稿者"]];
    var hd="<colgroup>"+cols.map(function(c){return'<col class="'+c[0]+'">'}).join("")+"</colgroup><thead><tr>"+cols.map(function(c){return"<th>"+c[1]+"</th>"}).join("")+"</tr></thead>";
    t.innerHTML=hd;
    var tb=document.createElement("tbody");
    rows.forEach(function(it){
      var tr=document.createElement("tr");if(it.status==="完了")tr.className="done";
      var td1=document.createElement("td");var st1=document.createElement("div");st1.className="stack";
      var no=document.createElement("span");no.className="no";no.textContent="#"+it._no;st1.appendChild(no);
      if(it.img){var ib=document.createElement("button");ib.type="button";ib.className="mini";ib.textContent="画像";ib.addEventListener("click",function(){openLb(it)});st1.appendChild(ib)}
      td1.appendChild(st1);tr.appendChild(td1);
      var td2=document.createElement("td");td2.className="place";td2.textContent=it.place||"（未入力）";if(!it.place)td2.style.color="var(--muted)";tr.appendChild(td2);
      var td3=document.createElement("td");td3.className="text";td3.textContent=it.text;tr.appendChild(td3);
      var td4=document.createElement("td");var st4=document.createElement("div");st4.className="stack";
      var ch=document.createElement("span");ch.className="chip";ch.textContent=it.category||"";st4.appendChild(ch);
      var sv=document.createElement("span");sv.className="sev-"+it.severity;sv.textContent="重要度 "+it.severity;st4.appendChild(sv);
      td4.appendChild(st4);tr.appendChild(td4);
      var td5=document.createElement("td");var st5=document.createElement("div");st5.className="stack";
      var sel=document.createElement("select");sel.className="status";sel.setAttribute("data-s",it.status);sel.setAttribute("aria-label","状況");
      STATUSES.forEach(function(s){var o=document.createElement("option");o.textContent=s;if(s===it.status)o.selected=true;sel.appendChild(o)});
      sel.addEventListener("change",function(){db.collection("issues").doc(it.id).update({status:sel.value}).catch(function(){toast("状況を変更できませんでした")})});
      st5.appendChild(sel);
      var who=document.createElement("span");who.className="small";who.textContent=(it.author||"匿名")+"・"+fmt(it.createdAt);st5.appendChild(who);
      if(it.uid&&it.uid===uid){
        var del=document.createElement("button");del.type="button";del.className="mini";del.textContent="削除";
        del.addEventListener("click",function(){
          if(del.dataset.armed!=="1"){del.dataset.armed="1";del.textContent="もう一度押すと削除";setTimeout(function(){del.dataset.armed="";del.textContent="削除"},3000);return}
          db.collection("issues").doc(it.id).delete().catch(function(){toast("削除できませんでした")});
        });
        st5.appendChild(del);
      }
      td5.appendChild(st5);tr.appendChild(td5);
      tb.appendChild(tr);
    });
    t.appendChild(tb);wrap.appendChild(t);
    $("out").textContent="";$("out").appendChild(wrap);
  }

  /* ---------- CSV ---------- */
  $("export").addEventListener("click",function(){
    var q=function(v){return '"'+String(v==null?"":v).replace(/"/g,'""')+'"'};
    var out=[["No","状況","重要度","種類","指摘箇所","指摘内容","投稿者","投稿日時","ピン位置(横%,縦%)"]];
    items.slice().sort(function(a,b){return a.createdAt-b.createdAt}).forEach(function(it,i){
      out.push([i+1,it.status,it.severity,it.category,it.place,it.text,it.author,new Date(it.createdAt).toLocaleString("ja-JP"),
        it.x==null?"":Math.round(it.x*100)+","+Math.round(it.y*100)]);
    });
    var csv="﻿"+out.map(function(r){return r.map(q).join(",")}).join("\r\n");
    var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
    a.download="shitteki-list.csv";document.body.appendChild(a);a.click();a.remove();
  });

  /* ---------- 接続 ---------- */
  syncSort();
  (function boot(){
    var cfg=window.FIREBASE_CONFIG;
    if(!cfg||!cfg.projectId||!cfg.apiKey){msg("接続設定（config.js）が入っていません。");return}
    firebase.initializeApp(cfg);
    firebase.auth().signInAnonymously().then(function(cred){
      uid=cred.user.uid;db=firebase.firestore();
      db.collection("issues").onSnapshot(function(snap){
        items=snap.docs.map(function(d){var v=d.data();v.id=d.id;return v});render();
      },function(){msg("一覧を読み込めませんでした。時間をおいて開き直してください。")});
    }).catch(function(){msg("接続できませんでした。時間をおいて開き直してください。")});
  })();
})();
</script>
</body>
</html>
