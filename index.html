<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>指摘ボード</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@700;900&display=swap">
<style>
:root{
  --bg:#f3f4f1; --surface:#ffffff; --fg:#1d2522; --muted:#66716c; --line:#d9ddd8;
  --accent:#1f5f4a; --accent-fg:#ffffff; --pin:#e5522b; --pin-fg:#ffffff;
  --ok:#2f7d4f; --warn:#b7791f; --crit:#c0392b; --chip:#e8ece8;
  --f-display:"Zen Kaku Gothic New","Noto Sans JP",sans-serif;
  --f-body:"Noto Sans JP",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#161b19; --surface:#1f2623; --fg:#e7ece9; --muted:#9aa6a0; --line:#34403b;
  --accent:#5fc4a0; --accent-fg:#0f1f19; --pin:#ff7a52; --pin-fg:#1a0d08;
  --ok:#62c48a; --warn:#e0b252; --crit:#ff8a7a; --chip:#2a3330; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.7 var(--f-body);
  padding:20px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:1680px;margin:0 auto;display:grid;gap:20px}
header{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:end;justify-content:space-between}
h1{font:900 26px/1.3 var(--f-display);margin:0;letter-spacing:.02em}
.sub{color:var(--muted);margin:2px 0 0;font-size:13px}
.hd-actions{display:flex;flex-wrap:wrap;gap:8px}
button,.btn{font:500 13px var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--fg);
  padding:7px 14px;border-radius:6px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
button:hover,.btn:hover{border-color:var(--accent)}
button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:700}
button:disabled{opacity:.5;cursor:not-allowed}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.botpane{position:sticky;top:12px;height:calc(100vh - 24px);min-height:480px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.botpane iframe{width:100%;height:100%;border:0;display:block}
.main{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;align-items:start;min-width:0}
@media(max-width:720px){.split{grid-template-columns:minmax(0,1fr)}.botpane{position:static;height:75vh}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;display:grid;gap:12px}
.panel h2{font:700 16px var(--f-display);margin:0}
label{display:grid;gap:4px;font-size:12px;color:var(--muted);font-weight:500}
input,select,textarea{font:400 14px var(--f-body);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%}
textarea{min-height:96px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.drop{border:1.5px dashed var(--line);border-radius:8px;padding:18px 12px;text-align:center;color:var(--muted);font-size:13px;background:var(--bg);cursor:pointer}
.drop.over{border-color:var(--accent);color:var(--fg)}
.drop strong{color:var(--fg)}
.shot{position:relative;border:1px solid var(--line);border-radius:6px;overflow:hidden;line-height:0;background:var(--bg)}
.shot img{width:100%;height:auto;display:block;max-height:560px;object-fit:contain;object-position:top left}
.shot.pickable{cursor:crosshair}
.pin{position:absolute;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;background:var(--pin);color:var(--pin-fg);
  font:700 12px/24px var(--f-body);text-align:center;box-shadow:0 0 0 2px var(--surface),0 2px 6px rgba(0,0,0,.35);pointer-events:none}
.hint{font-size:12px;color:var(--muted);margin:0}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters select{width:auto}
.count{margin-left:auto;color:var(--muted);font-size:12px}
.list{display:grid;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;display:grid;gap:10px;min-width:0}
.card.done{opacity:.7}
.card-top{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.no{font:900 13px var(--f-display);color:var(--accent)}
.chip{background:var(--chip);border-radius:4px;padding:1px 8px;font-size:12px}
.sev-高{color:var(--crit);font-weight:700}.sev-中{color:var(--warn);font-weight:700}.sev-低{color:var(--muted)}
.place{font-weight:700;overflow-wrap:anywhere}
.text{white-space:pre-wrap;overflow-wrap:anywhere;margin:0}
.meta{color:var(--muted);font-size:12px;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.meta .sp{margin-left:auto;display:flex;gap:6px}
.status{font-size:12px;padding:3px 8px;width:auto}
.status[data-s="未対応"]{color:var(--crit)}
.status[data-s="対応中"]{color:var(--warn)}
.status[data-s="完了"]{color:var(--ok)}
.empty{border:1px dashed var(--line);border-radius:8px;padding:28px 16px;text-align:center;color:var(--muted)}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.8);display:grid;place-items:center;padding:20px;z-index:20;overflow:auto}
.lb[hidden]{display:none}
.lb .shot{max-width:min(1100px,100%)}
.lb .shot img{max-height:none}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:6px;font-size:13px;z-index:30}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>指摘ボード</h1>
      <p class="sub">チャットボットの最終調整用。スクリーンショットに印を付けて、気になる点を全員で共有します。</p>
    </div>
    <div class="hd-actions">
      <a class="btn" id="open-bot" href="#" target="_blank" rel="noopener">チャットボットを開く ↗</a>
      <button id="export" type="button">CSVで書き出す</button>
    </div>
  </header>

  <div class="split">
  <section class="botpane" aria-label="チャットボット">
    <iframe id="bot" title="チャットボット" allow="clipboard-write"></iframe>
  </section>
  <div class="main">
    <section class="panel" aria-labelledby="new-h">
      <h2 id="new-h">指摘を追加</h2>
      <label>お名前（一覧に表示されます）
        <input id="author" type="text" maxlength="30" placeholder="例：山田">
      </label>
      <div id="drop" class="drop" tabindex="0" role="button" aria-label="スクリーンショットを追加">
        <strong>スクリーンショットを貼り付け</strong>（Ctrl/⌘ + V）<br>
        またはここにドロップ、クリックしてファイルを選択
        <input id="file" type="file" accept="image/*" hidden>
      </div>
      <div id="preview" hidden>
        <div class="shot pickable" id="pshot"><img id="pimg" alt="貼り付けたスクリーンショット"></div>
        <p class="hint" id="pinhint">画像をクリックすると、気になる位置にピンを置けます。</p>
        <button id="clear" type="button" style="margin-top:8px">画像を外す</button>
      </div>
      <label>場所（画面・質問番号など）
        <input id="place" type="text" maxlength="120" placeholder="例：アンケート 3問目 / チャット画面の最初の返答">
      </label>
      <div class="row2">
        <label>種類
          <select id="cat"><option>文言</option><option>デザイン</option><option>挙動</option><option>回答内容</option><option>その他</option></select>
        </label>
        <label>重要度
          <select id="sev"><option>高</option><option selected>中</option><option>低</option></select>
        </label>
      </div>
      <label>気になる点
        <textarea id="text" maxlength="3000" placeholder="何が気になるか、どうなってほしいかを書いてください"></textarea>
      </label>
      <button id="post" class="primary" type="button" disabled>指摘を投稿</button>
    </section>

    <section aria-labelledby="list-h" style="display:grid;gap:12px;min-width:0">
      <h2 id="list-h" style="font:700 16px var(--f-display);margin:0">共有された指摘</h2>
      <div class="filters">
        <select id="f-status" aria-label="状況で絞り込み"><option value="">すべての状況</option><option>未対応</option><option>対応中</option><option>完了</option></select>
        <select id="f-cat" aria-label="種類で絞り込み"><option value="">すべての種類</option><option>文言</option><option>デザイン</option><option>挙動</option><option>回答内容</option><option>その他</option></select>
        <select id="f-sev" aria-label="重要度で絞り込み"><option value="">すべての重要度</option><option>高</option><option>中</option><option>低</option></select>
        <span class="count" id="count"></span>
      </div>
      <div class="list" id="list"><div class="empty">読み込み中…</div></div>
    </section>
  </div>
  </div>
</div>
<div class="lb" id="lb" hidden><div class="shot" id="lbshot"><img id="lbimg" alt="指摘のスクリーンショット"></div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script>
(function(){
  var STATUSES=["未対応","対応中","完了"];
  var db=null, uid=null, items=[];
  var draft={blob:null,url:null,x:null,y:null};
  var $=function(id){return document.getElementById(id)};
  function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
  function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  function toast(msg){var t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(function(){t.remove()},2600)}
  function fmt(ts){if(!ts)return"";var d=new Date(ts);return (d.getMonth()+1)+"/"+d.getDate()+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")}
  function msg(html){$("list").innerHTML='<div class="empty">'+html+'</div>'}

  $("open-bot").href=window.CHATBOT_URL||"#";
  if(window.CHATBOT_URL)$("bot").src=window.CHATBOT_URL;
  $("author").value=lsGet("shitteki-author")||"";
  $("author").addEventListener("change",function(){lsSet("shitteki-author",$("author").value.trim())});

  /* ---------- 画像の取り込み(縮小してJPEG化) ---------- */
  function setDraftImage(blob){
    if(!blob||!/^image\//.test(blob.type)){toast("画像ファイルを選んでください");return}
    if(draft.url)URL.revokeObjectURL(draft.url);
    draft={blob:blob,url:URL.createObjectURL(blob),x:null,y:null};
    $("pimg").src=draft.url;$("preview").hidden=false;renderDraftPin();
  }
  function renderDraftPin(){
    var s=$("pshot");var old=s.querySelector(".pin");if(old)old.remove();
    if(draft.x!=null){
      var p=document.createElement("span");p.className="pin";p.textContent="●";
      p.style.left=(draft.x*100)+"%";p.style.top=(draft.y*100)+"%";s.appendChild(p);
      $("pinhint").textContent="ピンを置きました。位置を変えるには、もう一度クリックしてください。";
    }else $("pinhint").textContent="画像をクリックすると、気になる位置にピンを置けます。";
  }
  function toJpeg(blob){
    return new Promise(function(res,rej){
      var im=new Image();var u=URL.createObjectURL(blob);
      im.onload=function(){
        var w=im.naturalWidth,h=im.naturalHeight,max=1400;
        var sc=Math.min(1,max/Math.max(w,h));
        var cv=document.createElement("canvas");cv.width=Math.round(w*sc);cv.height=Math.round(h*sc);
        var cx=cv.getContext("2d");cx.fillStyle="#fff";cx.fillRect(0,0,cv.width,cv.height);cx.drawImage(im,0,0,cv.width,cv.height);
        URL.revokeObjectURL(u);
        var q=0.78,out=cv.toDataURL("image/jpeg",q);
        while(out.length>760000&&q>0.3){q-=0.1;out=cv.toDataURL("image/jpeg",q)}
        if(out.length>780000)rej(new Error("too_large"));else res(out);
      };
      im.onerror=function(){URL.revokeObjectURL(u);rej(new Error("bad_image"))};
      im.src=u;
    });
  }
  $("pshot").addEventListener("click",function(e){
    var r=$("pimg").getBoundingClientRect();
    draft.x=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width));
    draft.y=Math.min(1,Math.max(0,(e.clientY-r.top)/r.height));
    renderDraftPin();
  });
  $("clear").addEventListener("click",function(){
    if(draft.url)URL.revokeObjectURL(draft.url);
    draft={blob:null,url:null,x:null,y:null};$("preview").hidden=true;$("pimg").removeAttribute("src");
  });
  var drop=$("drop");
  drop.addEventListener("click",function(){$("file").click()});
  drop.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();$("file").click()}});
  $("file").addEventListener("change",function(e){var f=e.target.files[0];if(f)setDraftImage(f);e.target.value=""});
  ["dragenter","dragover"].forEach(function(n){drop.addEventListener(n,function(e){e.preventDefault();drop.classList.add("over")})});
  ["dragleave","drop"].forEach(function(n){drop.addEventListener(n,function(e){e.preventDefault();drop.classList.remove("over")})});
  drop.addEventListener("drop",function(e){var f=e.dataTransfer&&e.dataTransfer.files[0];if(f)setDraftImage(f)});
  document.addEventListener("paste",function(e){
    var its=(e.clipboardData&&e.clipboardData.items)||[];
    for(var i=0;i<its.length;i++){
      if(its[i].type.indexOf("image/")===0){var f=its[i].getAsFile();if(f){e.preventDefault();setDraftImage(f);return}}
    }
  });

  /* ---------- 投稿 ---------- */
  $("post").addEventListener("click",async function(){
    var text=$("text").value.trim(),author=$("author").value.trim();
    if(!author){toast("お名前を入力してください");$("author").focus();return}
    if(!text){toast("「気になる点」を入力してください");$("text").focus();return}
    var btn=$("post");btn.disabled=true;btn.textContent="投稿中…";
    try{
      var img=null;
      if(draft.blob)img=await toJpeg(draft.blob);
      lsSet("shitteki-author",author);
      await db.collection("issues").add({
        text:text,place:$("place").value.trim(),category:$("cat").value,severity:$("sev").value,
        status:"未対応",img:img,x:img&&draft.x!=null?draft.x:null,y:img&&draft.y!=null?draft.y:null,
        author:author,uid:uid,createdAt:Date.now()
      });
      $("text").value="";$("clear").click();toast("指摘を投稿しました");
    }catch(err){
      toast(err&&err.message==="too_large"?"画像が大きすぎます。範囲を絞って撮り直してください":"投稿できませんでした。もう一度お試しください");
    }finally{btn.disabled=false;btn.textContent="指摘を投稿"}
  });

  /* ---------- 一覧 ---------- */
  function pinFor(it){return it.x==null?"":'<span class="pin" style="left:'+(it.x*100)+'%;top:'+(it.y*100)+'%">'+it._no+'</span>'}
  function render(){
    var fs=$("f-status").value,fc=$("f-cat").value,fv=$("f-sev").value;
    var all=items.slice().sort(function(a,b){return a.createdAt-b.createdAt});
    all.forEach(function(it,i){it._no=i+1});
    var shown=all.filter(function(it){return(!fs||it.status===fs)&&(!fc||it.category===fc)&&(!fv||it.severity===fv)}).reverse();
    $("count").textContent=shown.length+" / "+all.length+" 件";
    var list=$("list");list.textContent="";
    if(!all.length){msg("まだ指摘はありません。左のフォームから最初の1件を追加してください。");return}
    if(!shown.length){msg("条件に合う指摘はありません。");return}
    shown.forEach(function(it){
      var c=document.createElement("article");c.className="card"+(it.status==="完了"?" done":"");
      var top=document.createElement("div");top.className="card-top";
      var no=document.createElement("span");no.className="no";no.textContent="#"+it._no;top.appendChild(no);
      var ch=document.createElement("span");ch.className="chip";ch.textContent=it.category||"";top.appendChild(ch);
      var sv=document.createElement("span");sv.className="sev-"+it.severity;sv.textContent="重要度 "+it.severity;top.appendChild(sv);
      c.appendChild(top);
      if(it.place){var pl=document.createElement("div");pl.className="place";pl.textContent=it.place;c.appendChild(pl)}
      if(it.img){
        var sh=document.createElement("div");sh.className="shot";sh.style.cursor="zoom-in";
        var im=document.createElement("img");im.alt="指摘 #"+it._no+" のスクリーンショット";im.src=it.img;
        sh.appendChild(im);sh.insertAdjacentHTML("beforeend",pinFor(it));
        sh.addEventListener("click",function(){openLb(it)});c.appendChild(sh);
      }
      var tx=document.createElement("p");tx.className="text";tx.textContent=it.text;c.appendChild(tx);
      var meta=document.createElement("div");meta.className="meta";
      var who=document.createElement("span");who.textContent=(it.author||"匿名")+"・"+fmt(it.createdAt);meta.appendChild(who);
      var sp=document.createElement("span");sp.className="sp";
      var sel=document.createElement("select");sel.className="status";sel.setAttribute("data-s",it.status);sel.setAttribute("aria-label","状況");
      STATUSES.forEach(function(s){var o=document.createElement("option");o.textContent=s;if(s===it.status)o.selected=true;sel.appendChild(o)});
      sel.addEventListener("change",function(){db.collection("issues").doc(it.id).update({status:sel.value}).catch(function(){toast("状況を変更できませんでした")})});
      sp.appendChild(sel);
      if(it.uid&&it.uid===uid){
        var del=document.createElement("button");del.type="button";del.textContent="削除";del.className="status";
        del.addEventListener("click",function(){
          if(del.dataset.armed!=="1"){del.dataset.armed="1";del.textContent="もう一度押すと削除";setTimeout(function(){del.dataset.armed="";del.textContent="削除"},3000);return}
          db.collection("issues").doc(it.id).delete().catch(function(){toast("削除できませんでした")});
        });
        sp.appendChild(del);
      }
      meta.appendChild(sp);c.appendChild(meta);list.appendChild(c);
    });
  }
  ["f-status","f-cat","f-sev"].forEach(function(id){$(id).addEventListener("change",render)});
  function openLb(it){
    var s=$("lbshot");var old=s.querySelector(".pin");if(old)old.remove();
    $("lbimg").src=it.img;s.insertAdjacentHTML("beforeend",pinFor(it));$("lb").hidden=false;
  }
  $("lb").addEventListener("click",function(){$("lb").hidden=true});
  document.addEventListener("keydown",function(e){if(e.key==="Escape")$("lb").hidden=true});

  /* ---------- CSV ---------- */
  $("export").addEventListener("click",function(){
    var q=function(v){return '"'+String(v==null?"":v).replace(/"/g,'""')+'"'};
    var rows=[["No","状況","重要度","種類","場所","気になる点","投稿者","投稿日時","ピン位置(横%,縦%)"]];
    items.slice().sort(function(a,b){return a.createdAt-b.createdAt}).forEach(function(it,i){
      rows.push([i+1,it.status,it.severity,it.category,it.place,it.text,it.author,new Date(it.createdAt).toLocaleString("ja-JP"),
        it.x==null?"":Math.round(it.x*100)+","+Math.round(it.y*100)]);
    });
    var csv="﻿"+rows.map(function(r){return r.map(q).join(",")}).join("\r\n");
    var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
    a.download="shitteki-list.csv";document.body.appendChild(a);a.click();a.remove();
  });

  /* ---------- 接続 ---------- */
  function boot(){
    var cfg=window.FIREBASE_CONFIG;
    if(!cfg||!cfg.projectId||!cfg.apiKey){msg("まだ接続設定（config.js）が入っていません。管理者が Firebase の設定を入れると使えるようになります。");return}
    firebase.initializeApp(cfg);
    firebase.auth().signInAnonymously().then(function(cred){
      uid=cred.user.uid;db=firebase.firestore();$("post").disabled=false;
      db.collection("issues").onSnapshot(function(snap){
        items=snap.docs.map(function(d){var v=d.data();v.id=d.id;return v});render();
      },function(){msg("一覧を読み込めませんでした。時間をおいて開き直してください。")});
    }).catch(function(){msg("接続できませんでした。時間をおいて開き直してください。")});
  }
  boot();
})();
</script>
</body>
</html>
